[project]
name = "tech-guilds"
version = "0.1.0"
description = "Motor cooperativo de gamificação em RPG para Squads de Tecnologia"
authors = [
    { name = "Squad", email = "dev@company.local" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "alembic (>=1.20.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "nats-py (>=2.16.0,<3.0.0)",
]

[tool.poetry]
packages = [
    { include = "domain" },
    { include = "primary" },
    { include = "secondary" },
    { include = "services" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyrefly]
search-path = ["."]
